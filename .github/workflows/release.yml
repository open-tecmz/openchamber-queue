name: build

# Build the installable package on every push to main and publish it two ways:
#   1. force-push the built files to the `release` branch, so users can install
#      with a git URL and get in-app updates (the host compares the package.json
#      version on that branch);
#   2. attach a .zip of the same package to a GitHub Release, for download installs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the bundler: bun.minify output can differ between versions, so a fixed
      # version keeps the published branch byte-identical for identical sources.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: npm ci

      - name: Build dist/
        run: npm run build

      - name: Read package version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Zip first, while dist/ is still pristine: the branch step below creates a
      # .git inside dist/, which must not end up in the archive.
      - name: Zip package
        id: zip
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          name="openchamber-queue-${VERSION}.zip"
          (cd dist && zip -qr "../${name}" . -x '.git/*')
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      # Publish the built package as an orphan `release` branch. It replaces the
      # previous build, so the branch has a single commit and no source files.
      - name: Publish release branch
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init -q
          git checkout -q -b release
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "release v${VERSION}"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.zip.outputs.name }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" "${ZIP}" \
            --title "v${VERSION}" \
            --notes "Built from ${GITHUB_SHA}." \
            || gh release upload "v${VERSION}" "${ZIP}" --clobber
